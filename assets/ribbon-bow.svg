<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 124">
  <!-- Dimensional satin bow: two loops, two notched tails and a knot, in graphite tones. No text. -->
  <defs>
    <linearGradient id="loop-l" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#868b96"/>
      <stop offset="0.45" stop-color="#555961"/>
      <stop offset="1" stop-color="#2b2d32"/>
    </linearGradient>
    <linearGradient id="loop-r" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#868b96"/>
      <stop offset="0.45" stop-color="#555961"/>
      <stop offset="1" stop-color="#2b2d32"/>
    </linearGradient>
    <linearGradient id="deep" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26282c"/>
      <stop offset="1" stop-color="#3d4046"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6f737c"/>
      <stop offset="0.5" stop-color="#3b3e44"/>
      <stop offset="1" stop-color="#2a2c31"/>
    </linearGradient>
    <linearGradient id="knot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e929c"/>
      <stop offset="0.5" stop-color="#4a4d54"/>
      <stop offset="1" stop-color="#2d2f34"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- tails -->
    <path d="M76 64L88 70L56 118L50 106L36 110Z" fill="url(#tail)" stroke="#e6e8ec" stroke-opacity="0.28" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M84 64L72 70L104 118L110 106L124 110Z" fill="url(#tail)" stroke="#e6e8ec" stroke-opacity="0.28" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M78 68L48 108M82 68L112 108" stroke="#000" stroke-opacity="0.3" stroke-width="1" fill="none"/>
    <!-- loops -->
    <path d="M76 58C60 20 14 10 8 38C4 60 36 82 76 62Z" fill="url(#loop-l)" stroke="#e6e8ec" stroke-opacity="0.32" stroke-width="0.9" stroke-linejoin="round"/>
    <path d="M84 58C100 20 146 10 152 38C156 60 124 82 84 62Z" fill="url(#loop-r)" stroke="#e6e8ec" stroke-opacity="0.32" stroke-width="0.9" stroke-linejoin="round"/>
    <!-- inner loop shading for depth -->
    <path d="M74 58C58 32 28 26 22 40C19 54 42 68 74 60Z" fill="url(#deep)"/>
    <path d="M86 58C102 32 132 26 138 40C141 54 118 68 86 60Z" fill="url(#deep)"/>
    <!-- satin highlights along the loop edges -->
    <path d="M70 52C56 28 26 18 14 34" stroke="#e6e8ec" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <path d="M90 52C104 28 134 18 146 34" stroke="#e6e8ec" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- knot -->
    <rect x="68" y="48" width="24" height="22" rx="8" fill="url(#knot)" stroke="#e6e8ec" stroke-opacity="0.32" stroke-width="0.9"/>
    <path d="M72 53C76 50 84 50 88 53" stroke="#e6e8ec" stroke-opacity="0.38" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
</svg>
